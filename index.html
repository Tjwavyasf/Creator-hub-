<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Hub</title>
<meta name="description" content="Post to every account at once and see analytics, comments, followers, best time to post and video drop-off in one place.">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creator Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Creator Hub</span></div>
  <div class="top-right">
    <span id="demo-pill" class="pill" hidden>Sample data</span>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="post">Post</button>
  <button data-tab="videos">Videos</button>
  <button data-tab="comments">Comments</button>
  <button data-tab="timing">When to post</button>
  <button data-tab="settings">Accounts</button>
</nav>

<main id="main" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
